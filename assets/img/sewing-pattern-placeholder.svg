<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Sewing pattern laid out on a wooden table">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9976F"/>
      <stop offset=".5" stop-color="#D3A47C"/>
      <stop offset="1" stop-color="#C48F67"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#3a1f12" flood-opacity=".38"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#3a1f12" flood-opacity=".35"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#B00870"/>
    </marker>
  </defs>

  <!-- wooden table -->
  <rect width="1200" height="800" fill="url(#wood)"/>
  <g stroke="#9C6C48" stroke-width="3" opacity=".55">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <g fill="none" stroke="#A9794F" stroke-width="1.6" opacity=".4" stroke-linecap="round">
    <path d="M0 60 C200 40 380 80 620 56 S1000 40 1200 66"/>
    <path d="M0 140 C260 160 460 120 700 146 S1040 170 1200 138"/>
    <path d="M0 268 C220 250 420 290 640 262 S980 244 1200 272"/>
    <path d="M0 340 C240 360 480 322 720 346 S1020 366 1200 336"/>
    <path d="M0 470 C200 452 440 488 660 462 S1000 446 1200 474"/>
    <path d="M0 540 C260 560 440 524 700 548 S1040 566 1200 538"/>
    <path d="M0 676 C220 658 420 694 640 668 S980 652 1200 680"/>
    <path d="M0 744 C240 762 480 728 720 750 S1020 766 1200 740"/>
  </g>

  <!-- pattern paper -->
  <g transform="translate(220 112) rotate(-3 380 288)">
    <rect width="760" height="576" fill="#FBF3E6" filter="url(#shadow)"/>
    <g stroke="#E8D9C3" stroke-width="1.4" fill="none" opacity=".9">
      <path d="M0 150 L760 144"/><path d="M0 300 L760 306"/><path d="M0 450 L760 446"/>
      <path d="M190 0 L196 576"/><path d="M380 0 L374 576"/><path d="M570 0 L576 576"/>
    </g>

    <!-- bodice front -->
    <g transform="translate(10 6)">
      <path id="bodice" d="M190 50 C170 100 130 110 80 110 L80 470 L310 470 L292 270 C270 210 265 140 300 85 Z"
            fill="#F6E9D6" stroke="#B00870" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M190 50 C170 100 130 110 80 110 L80 470 L310 470 L292 270 C270 210 265 140 300 85 Z"
            fill="none" stroke="#B00870" stroke-width="1.4" stroke-dasharray="7 6" opacity=".55"
            transform="translate(195 270) scale(.92) translate(-195 -270)"/>
      <path d="M292 330 L222 346 L292 362" fill="none" stroke="#B00870" stroke-width="1.8" stroke-linejoin="round"/>
      <line x1="195" y1="190" x2="195" y2="430" stroke="#B00870" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
      <g stroke="#B00870" stroke-width="2.2">
        <path d="M292 270 l-9 -3"/><path d="M80 300 l10 0"/><path d="M80 400 l10 0"/><path d="M190 470 l0 -9"/>
      </g>
      <circle cx="128" cy="140" r="4" fill="#B00870"/>
    </g>

    <!-- sleeve -->
    <g transform="translate(0 0)">
      <path d="M430 250 C450 120 540 60 600 70 C660 80 700 160 712 250 Q570 288 430 250 Z"
            fill="#F6E9D6" stroke="#B00870" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M430 250 C450 120 540 60 600 70 C660 80 700 160 712 250 Q570 288 430 250 Z"
            fill="none" stroke="#B00870" stroke-width="1.4" stroke-dasharray="7 6" opacity=".55"
            transform="translate(571 190) scale(.9) translate(-571 -190)"/>
      <line x1="571" y1="120" x2="571" y2="222" stroke="#B00870" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
      <circle cx="571" cy="92" r="4" fill="#B00870"/>
    </g>

    <!-- skirt panel -->
    <g>
      <path d="M440 340 L690 336 L728 530 L402 534 Z" fill="#F6E9D6" stroke="#B00870" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M440 340 L690 336 L728 530 L402 534 Z" fill="none" stroke="#B00870" stroke-width="1.4" stroke-dasharray="7 6" opacity=".55"
            transform="translate(565 435) scale(.9) translate(-565 -435)"/>
      <line x1="565" y1="372" x2="565" y2="500" stroke="#B00870" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
      <g stroke="#B00870" stroke-width="2.2"><path d="M440 340 l8 8"/><path d="M690 336 l-8 8"/></g>
    </g>

    <!-- washi tape -->
    <rect x="-26" y="26" width="92" height="30" fill="#F888D0" opacity=".78" transform="rotate(-38 20 41)"/>
    <rect x="696" y="530" width="92" height="30" fill="#F888D0" opacity=".78" transform="rotate(-38 742 545)"/>
    <rect x="708" y="-8" width="92" height="30" fill="#F4B9DC" opacity=".8" transform="rotate(34 754 7)"/>
  </g>

  <!-- scissors -->
  <g transform="translate(112 520) rotate(-22)" filter="url(#soft)">
    <path d="M-22 60 L14 -140 L20 -136 L-14 62 Z" fill="#D8D3CE" stroke="#8B847D" stroke-width="2"/>
    <path d="M22 60 L-14 -140 L-20 -136 L14 62 Z" fill="#E6E2DD" stroke="#8B847D" stroke-width="2"/>
    <circle cx="-30" cy="92" r="28" fill="none" stroke="#B00870" stroke-width="12"/>
    <circle cx="30" cy="92" r="28" fill="none" stroke="#B00870" stroke-width="12"/>
    <circle cx="0" cy="-32" r="6" fill="#8B847D"/>
  </g>

  <!-- thread spool -->
  <g filter="url(#soft)">
    <ellipse cx="1092" cy="200" rx="46" ry="46" fill="#F7E4C8" stroke="#B89A72" stroke-width="2"/>
    <circle cx="1092" cy="200" r="34" fill="#F888D0"/>
    <g stroke="#E264B6" stroke-width="2.2" fill="none">
      <circle cx="1092" cy="200" r="30"/><circle cx="1092" cy="200" r="24"/><circle cx="1092" cy="200" r="18"/>
    </g>
    <circle cx="1092" cy="200" r="9" fill="#F7E4C8" stroke="#B89A72" stroke-width="2"/>
  </g>

  <!-- pincushion with pins -->
  <g filter="url(#soft)">
    <circle cx="1080" cy="624" r="52" fill="#B00870"/>
    <circle cx="1080" cy="624" r="52" fill="none" stroke="#8C0757" stroke-width="3"/>
    <path d="M1080 572 L1080 676 M1028 624 L1132 624 M1043 587 L1117 661 M1117 587 L1043 661" stroke="#8C0757" stroke-width="1.6" opacity=".7"/>
    <g stroke="#E9E9E9" stroke-width="2.6" stroke-linecap="round">
      <line x1="1060" y1="606" x2="1120" y2="578"/><line x1="1074" y1="636" x2="1128" y2="650"/><line x1="1052" y1="640" x2="1030" y2="684"/>
    </g>
    <circle cx="1120" cy="578" r="5" fill="#F888D0"/><circle cx="1128" cy="650" r="5" fill="#FFE27A"/><circle cx="1030" cy="684" r="5" fill="#9EE0D4"/>
  </g>

  <!-- chalk -->
  <g transform="translate(92 214) rotate(28)" filter="url(#soft)">
    <rect x="-46" y="-12" width="92" height="24" rx="5" fill="#F7F1F5" stroke="#D8C9D2" stroke-width="2"/>
  </g>
</svg>
